{% extends "base.html" %}

{% block content %}


<div class="staff-page">

    <div class="staff-card">

        <h2 class="text-center mb-4">
            💼 Add Staff
        </h2>

        <form action="/staff" method="POST">

            <label>Staff Name</label>
            <input type="text" name="name" class="form-control" 
            placeholder="Enter Staff Name" required>


            <label class="mt-3">Specialization</label>
            <select name="specialization" class="form-select" required>

             <option value="">Select Specialization</option>
                <option>Hair Stylist</option>
                <option>Makeup Artist</option>
                <option>Threading</option>
                <option>Nail Artist</option>
                <option>Skin Specialist</option>
                <option>Hair Treatments</option>
                <option>Body Polishing & Scrub</option>
                <option>Hair Cutting</option>
                <option>Facial</option>
                <option> Hair Smoothening</option>
                 <option> Keratin Treatment</option>
                  <option> Hair Botox Treatment</option>
                   <option> Hair Highlighting</option>
            </select>

            <label class="mt-3">Phone Number</label>
            <input type="text" name="phone"  pattern="[0-9]{10}" maxlength="10" minlength="10"
            class="form-control"
            placeholder="Enter Phone Number" required>
             
             <label class="mt-3">Gender</label>
            <select name="gender" class="form-select" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                </select>

            <label class="mt-3">Experience</label>
            <input type="text" name="experience" class="form-control"
            placeholder="Staff experience">

             <br><br>
             <label>Available</label>
            
               <select name="available" required>
              <option value="">Select Status</option>
               <option value="Available">Available</option>
               <option value="Busy">Busy</option>
               <option value="On Leave">On Leave</option>
             </select>

             <br><br>
             
            <button type="submit" class="btn btn-service w-100 mt-4">
                Save Staff
            </button>

        </form>

    </div>

</div>

{% endblock %}
