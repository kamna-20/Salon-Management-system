{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="payment-box">

        <div class="payment-image">
            <img src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=900&q=80"
                 class="img-fluid"
                 alt="Payment">
        </div>

        <div class="payment-form">

            <h2>💳 Payment</h2>
            <p class="text-muted">Complete Salon Payment</p>

            <form action="/payment" method="POST">

                <label>Customer Name</label>
                <input type="text" name="customer_name"
                       class="form-control"
                       placeholder="Enter Customer Name" required>

                <label>Service</label>
               <select name="service_id" onchange="showPrice()" id="service">
               {% for service in services %}
               <option value="{{service.id}}" data-price="{{service.price}}">
                {{service.service_name}}
              </option>
              {% endfor %}
              </select>

            

          <script>
             function showPrice(){
             let service = document.getElementById("service");
             let price = service.options[service.selectedIndex].getAttribute("data-price");

              document.getElementById("amount").value =
                "₹" + price;
              }

             showPrice();
            </script>

                <label class="mt-3"> Total Amount (₹)</label>
                <input type="text" id="amount" 
                 class="form-control"readonly>
                      

                <label class="mt-3">Payment Method</label>
                <select name="payment_method" class="form-select" required>
                    <option value="">Select Method</option>
                    <option>Cash</option>
                    <option>UPI</option>
                    <option>Credit Card</option>
                    <option>Debit Card</option>
                </select>

                <button type="submit" class="btn payment-btn w-100 mt-4">
                    💳 Confirm Payment
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
