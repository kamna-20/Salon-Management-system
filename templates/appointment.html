{% extends "base.html" %}

{% block content %}


<div class="appointment-page">
       {% if message %}
<div class="booking-message">
    <div class="success-check">✓</div>
    <h2>{{ message }}</h2>
</div>
{% endif %}

    <div class="appointment-box">

        <div class="appointment-image">
            <img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=900&q=80"
                 alt="Salon Appointment">
        </div>


        <div class="appointment-form">

            <h2>📅 Book Appointment</h2>
            <p>Schedule your salon visit easily</p>

            {% if message %}
            <div class="message-box">
                    {{ message }}
            </div>       
            {% endif %}

            <form action="/appointment" method="POST">

                <label>Customer Name</label>
                <input type="text" name="customer_name"
                placeholder="Enter Customer Name" required >


                <label> Customer Gender</label>
                 <select name="customer_gender"
                 id="customer_gender"class="form-control" required>
                 <option value="" disabled selected>Select Gender</option>
                  <option value="Male"> Male</option>
                 <option value="Female">Female</option>
                 </select>
                


                  <!-- Address -->
                <label>Address</label>
                 <input
                        type="text"
                        name="customer_address"
                        placeholder="Enter your Address"
                        required
                    >

               
    


                <label>Service</label>
                <select name="service_name" id="service" class="form-select" required>
                    <option value="">Select Service</option>
                    {%  for service in services  %}
                    <option value="{{ service.service_name  }}">
                        {{  service.service_name }}
                    </option>
                    
                  {%  endfor %}
                  </select>


                <label>Date</label>
                <input type="date" name="appointment_date"  min="{{today}}" required>


                <label>Time</label>
                <input type="time" name="appointment_time" id="appointment_time" required>

             <label class="mt-3">Staff Name</label>
                 <select name="staff_name"  id="staff_name" class="form-select"required>
                    <option value="">Select Staff</option>
                    {% for staff in staffs %}
                    <option value="{{ staff.name }}" data-specialization="{{ staff.specialization}}" data-gender="{{ staff.gender }}">
                          {{ staff.name }}
                          ({{ staff.specialization }})
                    </option>
    
                   {%  endfor  %}
                 </select>



                <button type="submit">
                    Confirm Booking
                </button>

            </form>

        </div>

    </div>

</div>
<script>
    const dateInput = document.getElementById("appointment_date");
    const timeInput = document.getElementById("appointment_time");

    const today = new Date().toISOString().split("T")[0];
    dateInput.min = today;

    dateInput.addEventListener("change", function () {

        const selectedDate = new Date(this.value);
        const day = selectedDate.getDay();

        if (day === 0) {
            // Sunday: 11 AM - 6 PM
            timeInput.min = "11:00";
            timeInput.max = "18:00";
        } else {
            // Monday-Saturday: 10 AM - 8 PM
            timeInput.min = "10:00";
            timeInput.max = "20:00";
        }

        timeInput.value = "";
    });
</script>

{% endblock %}
